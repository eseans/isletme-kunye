name: Overture kesif

# Overture Maps Turkiye kesfi (anahtarsiz, herkese acik S3). Elle tetiklenir.
# Rapor repoya, tr.parquet artifact olarak (sonraki adimlar yerelde okur).
on:
  workflow_dispatch:
    inputs:
      surum:
        description: "Overture surumu (bos = betikteki varsayilan)"
        required: false

permissions:
  contents: write

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install duckdb
      - run: python3 scripts/overture_kesif.py
        env:
          OVERTURE_SURUM: ${{ github.event.inputs.surum }}
      - uses: actions/upload-artifact@v4
        with: { name: overture-tr, path: tr.parquet, retention-days: 7 }
      - name: Raporu kaydet
        run: |
          git config user.name "kunye-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rapor/
          git diff --cached --quiet || { git commit -m "rapor: Overture Turkiye kesfi" && git pull --rebase && git push; }
