name: Sehir kunye toplama

# Sehir(ler)in halka acik isletme kunyesini Overpass'ten (OSM) toplar, data/
# altina yazar ve isler. Kisisel veri toplanmaz (bkz. README - KVKK).
# Haftalik cron varsayilan seti (Istanbul Ankara Izmir); dispatch ile tek sehir.

on:
  schedule:
    # YOGUN DONEM: 2026-11-11'e kadar her gun Istanbul (Topla adimindaki
    # SON_TARIH gecilince bu tur kendini atlar). Sonrasinda haftalik set.
    - cron: "0 3 * * *"
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      sehir:
        description: "Şehir(ler) boşlukla, boşsa varsayılan set (Istanbul Ankara Izmir)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testler (KVKK beyaz listesi kilidi)
        run: node --test test/kunye.test.mjs

      - name: Topla
        env:
          SEHIR_GIRDISI: ${{ github.event.inputs.sehir }}
          TAKVIM: ${{ github.event.schedule }}
          SON_TARIH: "2026-11-11"
        run: |
          BUGUN=$(date -u +%F)
          if [ -n "$TAKVIM" ] && [ "$TAKVIM" = "0 3 * * *" ] && [[ "$BUGUN" > "$SON_TARIH" ]]; then
            echo "Gunluk yogun donem bitti ($BUGUN > $SON_TARIH) - gunluk tur atlandi."
            exit 0
          fi
          if [ -n "$TAKVIM" ] && [ "$TAKVIM" = "0 3 * * *" ]; then
            LISTE="Istanbul"
          else
            LISTE="${SEHIR_GIRDISI:-Istanbul Ankara Izmir}"
          fi
          for S in $LISTE; do
            echo "== $S =="
            node topla.mjs "$S"
          done

      - name: Site disari aktar
        run: node scripts/site_disari.mjs
      - name: IndexNow bildirimi
        run: node scripts/indexnow.mjs
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Kaydet
        run: |
          git config user.name "kunye-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "veri: kunye guncellendi $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "$GITHUB_REF_NAME" && break
              echo "push cakismasi, tekrar ($i)"; sleep 10
            done
          fi
