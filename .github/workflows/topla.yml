name: Sehir kunye toplama

# Sehir(ler)in halka acik isletme kunyesini Overpass'ten (OSM) toplar, data/
# altina yazar ve isler. Kisisel veri toplanmaz (bkz. README - KVKK).
# Haftalik cron varsayilan seti (Istanbul Ankara Izmir); dispatch ile tek sehir.

on:
  schedule:
    - cron: "0 3 * * 1" # her pazartesi 03:00 UTC
  workflow_dispatch:
    inputs:
      sehir:
        description: "Şehir(ler) boşlukla, boşsa haftalık set (Istanbul Ankara Izmir)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testler (KVKK beyaz listesi kilidi)
        run: node --test test/kunye.test.mjs

      - name: Topla
        env:
          SEHIR_GIRDISI: ${{ github.event.inputs.sehir }}
        run: |
          LISTE="${SEHIR_GIRDISI:-Istanbul Ankara Izmir}"
          for S in $LISTE; do
            echo "== $S =="
            node topla.mjs "$S"
          done

      - name: Kaydet
        run: |
          git config user.name "kunye-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "veri: kunye guncellendi $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "$GITHUB_REF_NAME" && break
              echo "push cakismasi, tekrar ($i)"; sleep 10
            done
          fi
